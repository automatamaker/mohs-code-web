# screen pixels (real, hardware)
WIDTH=1024  # 1280
HEIGHT=600  # 720

# reference/idealized screen pixels
REFX = 1980
REFY = 1080

def u(real, ref, v):
    if abs(v)<0.9999999:
        result = int( (float(real)/100.0) * (v*1000))
        if v<0:
            return real-result
        return result
    return int( (real/ref) * v )

def ux(*argv):
    global WIDTH, REFX
    acc = 0
    for v in argv:
        acc += u(WIDTH, REFX, v)
    return acc

def uy(*argv):
    global HEIGHT, REFY
    acc = 0
    for v in argv:
        acc += u(HEIGHT, REFY, v)
    return acc




# do not rename
async def custom_site():

    import sys
    import asyncio
    import platform
    import json
    from pathlib import Path



    import embed


    platform.document.body.style.background = "#7f7f7f"

    import pygame

    def compose():
        pygame.display.update()
        window.chromakey(None, *screen.get_colorkey(), 40)

    pygame.init()
    pygame.font.init()

    screen = pygame.display.set_mode([ux(.100),uy(.100)], pygame.SRCALPHA, 32)
    screen.set_colorkey( (0,0,0,0), pygame.RLEACCEL )
    screen.fill( (0,0,0,0) )

    compose()

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"



    apk = "mohs_code.apk"

    bundle = "mohs_code"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/mohs_code
    appdir.mkdir()


    # mount apk

    cfg = {
        "io": "url",
        "type":"mount",
        "mount" : {
            "point" : appdir.as_posix(),
            "path" : "/",
        },
        "path" : f"/ => {appdir.as_posix()}",
    }


    track = platform.window.MM.prepare(apk, json.dumps(cfg))

    marginx = ux(.020) # 20%
    marginy = uy(.045) # 45%


    def pg_bar(pos):
        nonlocal marginx, marginy
        # resolution of progress bar, recalculate since it may not be know yet.
        total = track.len or 10  # avoid div0
        slot = ux(.060)/ total # 60%

        pygame.draw.rect(screen,(10,10,10),( marginx-ux(10), marginy-uy(10), (total*slot)+ux(20), uy(110) ) )
        pygame.draw.rect(screen,(0,255,0), ( marginx, marginy, track.pos*slot, uy(90)) )

    # wait until zip mount + overlayfs is complete
    while not track.ready:
        pg_bar(track.pos)
        compose()
        await asyncio.sleep(.1)

    # fill it up in case it was cached and instant download
    pg_bar(track.len)
    compose()


    # preloader will change dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete
    # that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # start async top level machinery and add a console.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__ that is not yet set
    __import__(__name__).__file__ = str(main)


    # now make a prompt
    fnt = pygame.sysfont.SysFont("freesans",  uy(80) )

    def ui_callback(pkg, error=None):
        nonlocal fnt
        if error:
            prompt = fnt.render(f"{error}", True, "black")
        else:
            prompt = fnt.render(f"Setting [{pkg}] up", True, "black")
        pg_bar(track.len)
        screen.blit(prompt, ( marginx+ ux(80), marginy - uy(10) ) )
        compose()

    # test/wait if user media interaction required
    if not platform.window.MM.UME:

        # now make a prompt
        fnt = pygame.sysfont.SysFont("freesans",  uy(80) )
        prompt = fnt.render("Ready to start !", True, "blue")
        pg_bar(track.len)
        screen.blit(prompt, ( marginx+ ux(80), marginy - uy(10) ) )
        compose()
        print("""
        * Waiting for media user engagement : please click/touch page *
    """)
        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # cleanup
    screen.fill( (0,0,0,0) )
    pygame.display.flip()

    await shell.runpy(main, callback=ui_callback)



import asyncio

asyncio.run( custom_site() )

<script type="application/javascript">
// MOHS CODE 独自パッチ: iOS の音声解錠＋割り込み復帰。
// ブラウザは AudioContext をユーザー操作があるまで suspended にする。pygbag は
// ume_block:0 のとき解錠処理を登録しない(pythons.js:1207 "NO ume unlocker")。
//
// ★重要★ 効果音(pygame.mixer)は emscripten SDL_mixer の **SDL.audioContext** で
// 鳴る。SDL2.audioContext(録音キャプチャ用)とは別物。以前はこのパッチが SDL2 側
// だけを resume していたため、通知/電話/Siri 等の割り込みで停止した SDL.audioContext
// (＝効果音)が誰にも復帰されず「音だけ消える」状態になっていた(実機報告)。
// emscripten の autoResumeAudioContext は listenOnce の**一度きり**なので、初回復帰後
// は当てにできない。そこで見つかる AudioContext を**すべて** resume する。
// iOS の割り込み状態は "suspended" ではなく "interrupted" になることがあるので
// 「running 以外なら resume」で両方に対応する。
(function () {
    var TYPES = ["pointerdown", "touchstart", "touchend", "click", "keydown"];

    function contexts() {
        var M = window.python || window.Module || {};
        var list = [];
        try { if (M.SDL  && M.SDL.audioContext)  list.push(M.SDL.audioContext); }  catch (e) {}
        try { if (M.SDL2 && M.SDL2.audioContext) list.push(M.SDL2.audioContext); } catch (e) {}
        return list;
    }

    // 無音バッファを1発鳴らして iOS の音声出力を起こす。割り込み復帰時にも効く。
    function prime(ctx) {
        try {
            var src = ctx.createBufferSource();
            src.buffer = ctx.createBuffer(1, 1, 22050);
            src.connect(ctx.destination);
            src.start(0);
        } catch (e) {}
    }

    var watched = [];
    function watch(ctx) {
        if (watched.indexOf(ctx) !== -1) return;
        watched.push(ctx);
        try {
            // 割り込みで interrupted/suspended になった瞬間にも復帰を試みる
            // (実際に鳴るのは次のユーザー操作時のことが多いが、無害なので張る)。
            ctx.addEventListener("statechange", function () {
                if (ctx.state !== "running") {
                    try { ctx.resume(); } catch (e) {}
                }
                try { console.log("MOHS: audioctx state=" + ctx.state); } catch (e) {}
            });
        } catch (e) {}
    }

    function unlock() {
        var list = contexts();
        for (var i = 0; i < list.length; i++) {
            var ctx = list[i];
            watch(ctx);
            if (ctx.state !== "running") {
                try { ctx.resume(); } catch (e) {}
                prime(ctx);   // 割り込みからの復帰を後押し
            }
            if (ctx.state === "running" && !ctx._mohsLogged) {
                ctx._mohsLogged = true;
                try { console.log("MOHS: audio unlocked"); } catch (e) {}
            }
        }
    }

    TYPES.forEach(function (t) { window.addEventListener(t, unlock, true) });
    // アプリ(LINE/電話等)や通知から戻ってきた時にも復帰を試みる。
    document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") unlock();
    });
    window.addEventListener("focus", unlock);
    window.addEventListener("pageshow", unlock);
})();
</script>
